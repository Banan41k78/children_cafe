{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Детское кафе{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.jpg' %}" type="image/jpeg">
    <style>
	
	
		input, select, textarea {
			width: 100%;
			padding: 12px 15px;
			border: 2px solid #ffd1d1;
			border-radius: 15px;
			font-family: inherit;
			font-size: 1rem;
			background-color: #fffef7;
		}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
		/* Для радиокнопок звёзд */
.star-rating {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.star-rating li {
    list-style: none;
}
.star-rating input {
    margin-right: 5px;
}
.comment-item {
    transition: background 0.2s;
}
.comment-item:hover {
    background-color: #fff5e6;
}
.like-btn, .reply-btn {
    background: none;
    border: none;
    color: #ff6b6b;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 5px 10px;
    border-radius: 20px;
}
.like-btn:hover, .reply-btn:hover {
    background-color: #ffd1d1;
}

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }

        .btn-light {
            background-color: #fff9f0;
            color: #ff6b6b;
            border: 2px solid #ffa502;
        }

        .btn-light:hover {
            background-color: #ffa502;
            color: white;
            transform: scale(1.05);
        }

        .btn-kid {
            background-color: #ff6b6b;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-kid:hover {
            background-color: #ff4757;
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: #2d3436;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #555;
        }

        /* Карточка */
        .card {
            background-color: #fff9f0;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Сетка (flexbox) */
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .col {
            flex: 1;
            min-width: 250px;
        }

        /* Утилиты */
        .text-center { text-align: center; }
        .mt-3 { margin-top: 1rem; }
        .mt-4 { margin-top: 1.5rem; }
        .mt-5 { margin-top: 3rem; }
        .mb-3 { margin-bottom: 1rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-5 { margin-bottom: 3rem; }
        .me-2 { margin-right: 0.5rem; }
        .p-3 { padding: 1rem; }
        .p-4 { padding: 1.5rem; }

        /* Алерт */
        .alert {
            background-color: #ffeaa7;
            border-left: 8px solid #fdcb6e;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
        }

        .list-unstyled {
            list-style: none;
            padding-left: 0;
        }

        hr {
            border: none;
            height: 2px;
            background-color: #ff6b6b;
            margin: 20px 0;
        }

        /* Шапка и навигация */
        .navbar {
            background-color: #ffa502;
            padding: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .navbar-brand img {
            height: 50px;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background-color: #ff4757;
        }

        /* Карточка меню (каталог) */
        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .menu-item-card {
            flex: 1 1 calc(33% - 20px);
            background-color: #fff9f0;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .menu-item-card:hover {
            transform: translateY(-5px);
        }
        .menu-item-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .menu-item-card .info {
            padding: 15px;
        }
        @media (max-width: 768px) {
            .menu-item-card {
                flex: 1 1 100%;
            }
        }

        footer {
            background-color: #2d3436;
            color: #dfe6e9;
            padding: 40px 20px 20px;
            margin-top: 40px;
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
        }
        .footer-col {
            flex: 1;
            min-width: 200px;
        }
        .footer-col h4 {
            color: #ffa502;
            border-bottom: 2px solid #ff6b6b;
            display: inline-block;
            margin-bottom: 15px;
        }
        .footer-col ul {
            list-style: none;
        }
        .footer-col a {
            color: #dfe6e9;
            text-decoration: none;
        }
        .footer-col a:hover {
            color: #ffa502;
        }
        .social-links a {
            font-size: 1.8rem;
            margin-right: 10px;
            transition: 0.2s;
        }
        .social-links a:hover {
            transform: scale(1.2);
            display: inline-block;
        }
        .copyright {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ffa502;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .navbar .container {
                flex-direction: column;
                gap: 15px;
            }
            .footer-container {
                flex-direction: column;
            }
            .menu-item-card {
                flex: 1 1 100%;
            }
        }
		.form-group {
    margin-bottom: 1.5rem;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 0.5rem;
    color: #2d3436;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="number"],
input[type="datetime-local"],
select,
textarea {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ffd1d1;
    border-radius: 15px;
    font-family: inherit;
    font-size: 1rem;
    transition: all 0.3s ease;
    background-color: #fffef7;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #ffa502;
    box-shadow: 0 0 0 3px rgba(255, 165, 2, 0.2);
}

.btn-submit {
    background-color: #ff6b6b;
    color: white;
    width: 100%;
    padding: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.btn-submit:hover {
    background-color: #ff4757;
    transform: scale(1.02);
}

.errorlist {
    list-style: none;
    background-color: #ffeaa7;
    padding: 8px 15px;
    border-radius: 20px;
    color: #d63031;
    margin-top: 5px;
    font-size: 0.9rem;
}

.alert-success {
    background-color: #c8f7c5;
    color: #218c2e;
    padding: 12px;
    border-radius: 25px;
    text-align: center;
    margin-bottom: 20px;
    border-left: 5px solid #00b894;
}
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'includes/header.html' %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include 'includes/footer.html' %}
</body>
</html>
